# ============================================================
#  .github/workflows/docker.yml
#
#  Publishes the project's PRODUCTION image to Docker Hub.
#
#  Triggers:
#    - Push to main (every merge develop → main is a release)
#    - Tag v*.*.* on main         → adds the semver tags
#    - Manual dispatch
#
#  No re-test here: the image was built and smoke-tested by CI
#  ("Production image") on develop's head commit, which the main
#  ruleset requires to be green before the merge.
#
#  Skips cleanly (with a notice) until the project is ready:
#    - manage.py and uv.lock exist (not a fresh template), and
#    - the DOCKERHUB_USERNAME repository variable is set.
#
#  Jobs:
#    ready    project state + image name  docker.io/<DOCKERHUB_USERNAME>/<repo>
#    publish  Docker's reusable builder (docker/github-builder): native
#             amd64 + arm64 builds, SBOM, Sigstore-signed provenance.
#             Tags: latest · sha-<short> · <version> + <major>.<minor> on v* tags
#    scan     Trivy scan of the pushed digest → Security tab (informational)
#
#  Required configuration (Settings → Secrets and variables → Actions):
#    Variable  DOCKERHUB_USERNAME   Docker Hub namespace (not secret)
#    Secret    DOCKERHUB_TOKEN      Docker Hub access token (Read & Write)
# ============================================================

name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:

  ready:
    name: Detect project state
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ready to publish?
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          skip() { echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::Production image not published — $1"; echo "⏭️ $1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          [ -f manage.py ] && [ -f uv.lock ] || skip "project not initialised yet (manage.py / uv.lock missing)."
          [ -n "$DOCKERHUB_USERNAME" ] || skip "repository variable DOCKERHUB_USERNAME is not set."
          image="docker.io/${DOCKERHUB_USERNAME}/${REPO_NAME,,}"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Publishing \`${image}\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: ready
    if: needs.ready.outputs.ready == 'true'
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read
      id-token: write   # keyless (Sigstore) signing of the provenance attestation
    with:
      output: image
      push: true
      context: .
      file: docker/Dockerfile.prod
      target: runtime
      platforms: linux/amd64,linux/arm64
      runner: |
        default=ubuntu-26.04
        linux/arm64=ubuntu-26.04-arm
      cache: true
      cache-mode: max
      sbom: true
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ${{ needs.ready.outputs.image }}
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=sha,prefix=sha-,format=short
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  scan:
    name: Scan
    needs: [ready, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload Trivy SARIF to the Security tab
    steps:
      # Informational (exit-code 0): findings land in Security → Code scanning.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.ready.outputs.image }}@${{ needs.publish.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif

      - name: Write job summary
        if: always()
        env:
          IMAGE: ${{ needs.ready.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          META_JSON: ${{ needs.publish.outputs.meta-json }}
          VERIFY: ${{ needs.publish.outputs.cosign-verify-commands }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## 🐳 Published production image"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Image** | \`${IMAGE}\` |"
            echo "| **Digest** | \`${DIGEST}\` |"
            echo "| **Tags** | $(jq -r '[.tags[] | "`" + . + "`"] | join(" ")' <<<"$META_JSON") |"
            echo "| **Platforms** | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| **Commit** | \`${SHA}\` |"
            echo ""
            echo "### Verify the signed provenance"
            echo '```bash'
            echo "$VERIFY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
