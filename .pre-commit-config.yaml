# ============================================================
#  .pre-commit-config.yaml — git hooks
#
#  pre-commit keeps every tool in its own cache (~/.cache/pre-commit), including
#  the Node.js that cspell and markdownlint need, so nothing is installed in the
#  dev container itself. The first run installs them (a few minutes).
#
#  Node.js is pinned to one exact LTS release (default_language_version below),
#  so the dev container, CI and every other machine run the same version. Without
#  a pin, pre-commit uses whatever Node.js is on PATH (the CI runner's) or asks
#  nodeenv for "latest", which can be a pre-release it cannot parse. Dependabot
#  cannot bump that line: .github/scripts/check-node-pin.sh warns in CI when the
#  pin nears end-of-life, and the weekly Image contract run fails (template)
#  when a newer LTS exists. To bump: take the newest LTS x.y.z from
#  https://nodejs.org/en/download, edit the line below, then run
#  `pre-commit run --all-files` and commit.
#
#  Install once, after `uv init` (all hook types in one go):
#    pre-commit install
#
#  pre-commit refuses to run while this file has unstaged changes ("Your
#  pre-commit configuration is unstaged"): commit a change to it first.
#
#  Branch model: topic branch → PR → develop → PR → main. Nobody commits or
#  pushes to develop or main: `no-commit-to-branch` stops a commit there and
#  `block-protected-push` stops a push (the GitHub rulesets are the real gate).
#
#  Dependabot's pre-commit ecosystem bumps every `rev:` weekly.
#  Keep the ruff hook's rev equal to ruff in uv.lock — their
#  Dependabot PRs arrive the same Monday; merge them together.
# ============================================================
default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push
default_stages: [pre-commit]
default_language_version:
  node: 26.13.0   # LTS "Lithium", supported until 2029-04-30

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^(\.vscode|\.devcontainer)/   # JSON with comments (JSONC)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: debug-statements
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix, --output-format=full]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.33.0
    hooks:
      - id: django-upgrade
        args: [--target-version, auto]   # reads the Django version from pyproject.toml

  # Keeps uv.lock in sync whenever pyproject.toml changes.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock

  # Schema-validates the workflow and Dependabot files before they reach CI.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-dependabot

  # The checks of .github/workflows/lint.yml, run before the commit instead of after the push. Same configuration
  # files (cspell.json, .markdownlint-cli2.jsonc, .hadolint.yaml, .github/actionlint.yaml, .github/zizmor.yml).
  # Not here: `docker compose config` (needs Docker, which the dev container does not have) and the online audits
  # of zizmor (they need a GitHub token), so a green commit is not a promise that Lint passes: CI stays the gate.
  # The revs are pinned separately from the tools bundled in the workflow's actions, so versions can differ slightly.
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.4.0
    hooks:
      - id: cspell

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: [--persona=regular, --offline, --no-progress]

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, chore, docs, style, refactor, perf, test, build, ci, revert, wip]

  # Local pre-push guard: no direct push to an existing main or develop.
  - repo: local
    hooks:
      - id: block-protected-push
        name: block direct pushes to main and develop
        entry: bash scripts/block-protected-push.sh
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
