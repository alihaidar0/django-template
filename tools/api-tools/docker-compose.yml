# ============================================================
#  tools/api-tools/docker-compose.yml
#
#  The two tools of the API-contract CI jobs (ci.yml), as pinned containers:
#    oasdiff   breaking-change check and changelog between two OpenAPI files
#    spectral  style linter (ruleset: .spectral.yaml)
#
#  Pulled, never built, and not part of the dev stack. They run as containers
#  and not as GitHub Actions on purpose: GitHub checks every action a workflow
#  references against the repository's allowed-actions list when the workflow
#  starts, even in jobs that are skipped, so an action that is not allowed would
#  fail CI itself in every project that has no API yet. No Node.js, and nothing
#  added to the dev image.
#
#  Dependabot (docker-compose ecosystem, directory /tools/api-tools) bumps the
#  tags and digests. Keep this file outside .github/: Dependabot's pull requests
#  for it failed there with a 400 (dependency_file_not_supported). The oasdiff
#  project also publishes release candidates (v1.x.y-rc.N): merge only stable tags.
#
#  Run from the repository root, for example:
#    docker compose -f tools/api-tools/docker-compose.yml run --rm spectral \
#      lint openapi/schema.yaml --ruleset .spectral.yaml
#    docker compose -f tools/api-tools/docker-compose.yml run --rm oasdiff \
#      breaking /path/to/old.yaml openapi/schema.yaml
# ============================================================

services:
  oasdiff:
    image: tufin/oasdiff:v1.37.0@sha256:ff02af37a254b5199b9d72e7bba93dae5837a9119d59459168d1398893b47aea
    working_dir: /w
    volumes:
      - ../..:/w:ro

  spectral:
    image: stoplight/spectral:6.17.1@sha256:3b05e6cd9d43375c454cc0c022e91b3285851043b05c3e738342ea3f84cde76d
    working_dir: /w
    volumes:
      - ../..:/w:ro
    environment:
      NODE_NO_WARNINGS: "1"
